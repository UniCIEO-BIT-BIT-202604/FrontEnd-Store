<div class="page page-category">
  <div class="header-actions">
    <h2>Editar Categoría</h2>
    <a routerLink="/category/list" class="btn-back">Volver a la Lista</a>
  </div>

  <form [formGroup]="formData" class="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="category-name">Nombre de la Categoría *</label>
      <input type="text" formControlName="name" id="category-name">
      @if (name?.invalid && (name?.dirty || name?.touched)) {
        @if (name?.errors?.['required']) {
          <small class="error">El nombre es obligatorio</small>
        } @else if (name?.errors?.['minlength']) {
          <small class="error">Mínimo 5 caracteres</small>
        }
      }
    </div>

    <div class="field">
      <label for="category-slug">Slug</label>
      <input type="text" formControlName="slug" id="category-slug">
    </div>

    <div class="field">
      <label for="category-description">Descripción</label>
      <textarea formControlName="description" id="category-description" rows="3"></textarea>
    </div>

    <!-- Sección de Imagen de Categoría -->
    <div class="field images-management-section">
      <label>Imagen Actual de la Categoría</label>

      <div class="previews-container">
        <div class="preview-card">
          <img [src]="getImageUrl()" alt="Imagen Categoría" class="preview-img">
        </div>
      </div>

      <div class="field" style="margin-top: 10px;">
        <label for="category-new-image">Reemplazar Imagen (Opcional)</label>
        <input
          type="file"
          id="category-new-image"
          accept="image/png, image/jpeg, image/jpg, image/webp"
          (change)="onFileSelected($event)"
        >
        @if (imageError) {
          <small class="error">{{ imageError }}</small>
        }
      </div>

      <button type="button" class="btn-danger-sm" (click)="removeImage()" style="margin-top: 8px;">
        Quitar / Restablecer Imagen por Defecto
      </button>
    </div>

    <div class="field">
      <label>Estado</label>
      <div class="options">
        <label class="radio-label">
          <input [value]="true" type="radio" formControlName="status"> Activo
        </label>
        <label class="radio-label">
          <input [value]="false" type="radio" formControlName="status"> Inactivo
        </label>
      </div>
    </div>

    <div class="field form-actions">
      <button type="submit" class="btn-submit" [disabled]="formData.invalid">
        Guardar Cambios
      </button>
    </div>
  </form>
</div>
