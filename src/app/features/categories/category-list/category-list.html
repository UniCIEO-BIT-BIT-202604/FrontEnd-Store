<div class="page page-category">
  <div class="header-actions">
    <h2>Lista de Categorías</h2>
    <a routerLink="/category/new" class="btn-new">Nueva Categoría</a>
  </div>

  <div class="table-container" *ngIf="(categoryList$ | async) as categories">
    <table class="category-table" *ngIf="categories.length > 0; else noCategories">
      <thead>
        <tr>
          <th>Imagen / Icono</th>
          <th>Nombre</th>
          <th>Slug</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of categories">
          <td class="avatar-cell">
            <!-- EVALUACIÓN: Si la categoría NO tiene imagen o tiene la imagen por defecto -->
            <ng-container *ngIf="!category.urlImage || category.urlImage === defaultCategoryImageUrl || category.urlImage === '/' + defaultCategoryImageUrl; else customImage">
              <!-- 1. Imagen por defecto servida desde el backend -->
              <img [src]="serverHostUrl + defaultCategoryImageUrl" [alt]="category.name" class="category-image" title="1. Imagen Estática por Defecto (Backend)">

              <!-- 2. Imagen generada dinámicamente desde UI-Avatars API -->
              <img [src]="defaultUIAvatarAPI + '?name=' + category.name + '&background=2563EB&color=fff'" class="category-image" title="2. API UI-Avatars">

              <!-- 3. Icono vectorial con FontAwesome -->
              <fa-icon [icon]="faFolder" size="2x" class="user-avatar-default" title="3. Icono FontAwesome" style="color: #2563eb;"></fa-icon>
            </ng-container>

            <!-- Imagen personalizada cargada por el usuario -->
            <ng-template #customImage>
              <img [src]="getCustomImageUrl(category.urlImage)" [alt]="category.name" class="category-image" title="Imagen de Categoría Personalizada">
            </ng-template>
          </td>
          <td><strong>{{ category.name }}</strong></td>
          <td><code>{{ category.slug || 'N/A' }}</code></td>
          <td>{{ category.description || 'Sin descripción' }}</td>
          <td>
            <hugeicons-icon
              *ngIf="category.status"
              class="toggle-icon toggle-on-icon"
              [icon]="ToggleOnIcon"
              [size]="28"
              color="currentColor"
              [strokeWidth]="1.5"
            ></hugeicons-icon>
            <hugeicons-icon
              *ngIf="!category.status"
              class="toggle-icon toggle-off-icon"
              [icon]="ToggleOffIcon"
              [size]="28"
              color="currentColor"
              [strokeWidth]="1.5"
            ></hugeicons-icon>
          </td>
          <td class="actions-cell">
            <a [routerLink]="['/category/edit', category._id]" class="btn-action btn-edit">Editar</a>
            <button (click)="deleteCategory(category._id)" class="btn-action btn-delete">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #noCategories>
      <div class="empty-state">
        <p>No hay categorías registradas en el sistema.</p>
      </div>
    </ng-template>
  </div>
</div>
