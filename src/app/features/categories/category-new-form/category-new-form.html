<div class="page page-category">
  <div class="header-actions">
    <h2>Registrar Nueva Categoría</h2>
    <a routerLink="/category/list" class="btn-back">Volver a la Lista</a>
  </div>

  <form [formGroup]="formData" class="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="category-name">Nombre de la Categoría *</label>
      <input type="text" formControlName="name" id="category-name" placeholder="Ej: Electrónica">
      <small class="error" *ngIf="name?.invalid && (name?.dirty || name?.touched)">
        <span *ngIf="name?.errors?.['required']">El nombre de la categoría es obligatorio</span>
        <span *ngIf="name?.errors?.['minlength']">Mínimo 5 caracteres</span>
      </small>
    </div>

    <div class="field">
      <label for="category-slug">Slug (Opcional, se autogenera si se deja vacío)</label>
      <input type="text" formControlName="slug" id="category-slug" placeholder="Ej: electronica">
    </div>

    <div class="field">
      <label for="category-description">Descripción</label>
      <textarea formControlName="description" id="category-description" rows="3" placeholder="Descripción breve"></textarea>
    </div>

    <!-- Carga de Imagen de Categoría -->
    <div class="field images-upload-section">
      <label for="category-image">Imagen de la Categoría (Opcional, Máx 2MB)</label>
      <input
        type="file"
        id="category-image"
        accept="image/png, image/jpeg, image/jpg, image/webp"
        (change)="onFileSelected($event)"
      >
      <small class="info-text">Si no se selecciona ninguna imagen, se asignará la imagen por defecto automáticamente.</small>
      <small class="error" *ngIf="imageError">{{ imageError }}</small>

      <!-- Previsualización -->
      <div class="previews-container" *ngIf="previewUrl">
        <div class="preview-card">
          <img [src]="previewUrl" alt="Previsualización" class="preview-img">
          <button type="button" class="btn-remove-preview" (click)="removePreview()" title="Quitar imagen">&times;</button>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Estado</label>
      <div class="options">
        <label class="radio-label">
          <input [value]="true" type="radio" formControlName="status" id="category-status-enable">
          Activo
        </label>
        <label class="radio-label">
          <input [value]="false" type="radio" formControlName="status" id="category-status-disable">
          Inactivo
        </label>
      </div>
    </div>

    <div class="field form-actions">
      <button type="submit" class="btn-submit" [disabled]="formData.invalid">
        Registrar Categoría
      </button>
    </div>
  </form>
</div>
