<div class="page page-product">
  <div class="header-actions">
    <h2>Editar Producto</h2>
    <a routerLink="/product/list" class="btn-back">Volver a la Lista</a>
  </div>

  <form [formGroup]="formData" class="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="product-refcode">Código de Referencia *</label>
      <input type="text" formControlName="referenceCode" id="product-refcode">
      <small class="error" *ngIf="referenceCode?.invalid && (referenceCode?.dirty || referenceCode?.touched)">
        <span *ngIf="referenceCode?.errors?.['required']">La referencia es obligatoria</span>
      </small>
    </div>

    <div class="field">
      <label for="product-name">Nombre del Producto *</label>
      <input type="text" formControlName="name" id="product-name">
      <small class="error" *ngIf="name?.invalid && (name?.dirty || name?.touched)">
        <span *ngIf="name?.errors?.['required']">El nombre es obligatorio</span>
        <span *ngIf="name?.errors?.['minlength']">Mínimo 3 caracteres</span>
      </small>
    </div>

    <div class="field">
      <label for="product-description">Descripción</label>
      <textarea formControlName="description" id="product-description" rows="3"></textarea>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="product-price">Precio ($) *</label>
        <input type="number" formControlName="price" id="product-price" min="0" step="0.01">
      </div>

      <div class="field">
        <label for="product-stock">Stock *</label>
        <input type="number" formControlName="stock" id="product-stock" min="1">
      </div>
    </div>

    <div class="field">
      <label for="product-category">Categoría *</label>
      <select formControlName="category" id="product-category">
        <option value="">Seleccione una categoría...</option>
        <option *ngFor="let categoryItem of (categoryList$ | async)" [value]="categoryItem._id">
          {{ categoryItem.name }}
        </option>
      </select>
    </div>

    <div class="field">
      <label>Estado</label>
      <div class="options">
        <label class="radio-label">
          <input [value]="true" type="radio" formControlName="status"> Activo
        </label>
        <label class="radio-label">
          <input [value]="false" type="radio" formControlName="status"> Inactivo
        </label>
      </div>
    </div>

    <!-- SECCIÓN DE GESTIÓN DE IMÁGENES EXISTENTES -->
    <div class="field images-management-section">
      <div class="section-title-bar">
        <label>Imágenes Actuales Guardadas</label>
        <button type="button" class="btn-danger-sm" *ngIf="existingImages.length > 0" (click)="removeAllExistingImages()">
          Remover Todas las Imágenes
        </button>
      </div>

      <div class="gallery-container" *ngIf="existingImages.length > 0; else noExisting">
        <div class="gallery-card" *ngFor="let img of existingImages" [class.is-main-card]="img.isMain">
          <span class="main-badge" *ngIf="img.isMain">Principal</span>
          <img [src]="getImageUrl(img.url)" [alt]="'Imagen de producto'" class="gallery-img">

          <div class="card-overlay-actions">
            <button
              type="button"
              class="btn-icon btn-star"
              [class.active]="img.isMain"
              (click)="setMainImage(img.url)"
              title="Establecer como principal"
            >
              ★
            </button>
            <button
              type="button"
              class="btn-icon btn-delete"
              (click)="removeExistingImage(img.url)"
              title="Eliminar imagen"
            >
              &times;
            </button>
          </div>
        </div>
      </div>
      <ng-template #noExisting>
        <p class="info-text danger-text">No hay imágenes previas conservadas.</p>
      </ng-template>
    </div>

    <!-- SECCIÓN PARA ADJUNTAR NUEVAS IMÁGENES -->
    <div class="field images-upload-section">
      <label for="product-new-images">Adjuntar Nuevas Imágenes Adicionales (Máximo 9 en total)</label>
      <input
        type="file"
        id="product-new-images"
        multiple
        accept="image/png, image/jpeg, image/jpg, image/webp"
        (change)="onFilesSelected($event)"
      >
      <small class="error" *ngIf="imageError">{{ imageError }}</small>

      <!-- Previsualización de Nuevas Imágenes Adjuntas -->
      <div class="previews-container" *ngIf="selectedFiles.length > 0">
        <div class="preview-card" *ngFor="let item of selectedFiles; let i = index">
          <span class="new-badge">Nueva</span>
          <img [src]="item.previewUrl" [alt]="item.file.name" class="preview-img">
          <button type="button" class="btn-remove-preview" (click)="removeNewSelectedFile(i)">&times;</button>
        </div>
      </div>
    </div>

    <div class="field form-actions">
      <button type="submit" class="btn-submit" [disabled]="formData.invalid">
        Guardar Cambios
      </button>
    </div>
  </form>
</div>
