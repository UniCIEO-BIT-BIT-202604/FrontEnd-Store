<div class="page page-user">
  <h2 class="title title-form title-user-form">Editusuarios</h2>

  <pre>ID {{ selectedId }}</pre>

  <pre class="pre">{{ roleList$ | async | json }}</pre>

  <p>Por favor diligencie todos los campos del formulario</p>

  <a routerLink="/user/list">Return User List</a>

  <form
    [formGroup]="formData"
    (ngSubmit)="onSubmit()"
    class="form form-user"
  >

    <div class="field">
      <label for="user-name">User name</label>
      <input formControlName="name" id="user-name" type="text" placeholder="Ej: Manuela Gomez" >
    </div>
    <div class="field">
      <label for="user-nickname">Nickname</label>
      <input formControlName="nickname" id="user-nickname" type="text" placeholder="Ej: Manu">
    </div>
    <div class="field">
      <label for="user-email">E-mail</label>
      <input formControlName="email" id="user-email" type="email" placeholder="Ej: manu.gomez@correo.co">
    </div>
    <div class="field">
      <label for="user-password">Password</label>
      <input formControlName="password" id="user-password" type="password" placeholder="Ej: 123456789">
    </div>
    <div class="field">
      <label for="user-confirm-password">Confirm Password</label>
      <input formControlName="confirmPassword" id="user-confirm-password" type="password" placeholder="Ej: 123456789">
    </div>
    <div class="field">
      <label for="user-status">User status</label>
      <div class="options">
        <input id="user-status-enable" formControlName="status" type="radio" [value]="true"><label for="user-status-enable">Enable</label>
        <input id="user-status-disable" formControlName="status" type="radio" [value]="false"><label for="user-status-disable">Disable</label>
      </div>
    </div>
    <div class="field">
      <label for="user-role">Roles</label>
      <select formControlName="role" id="user-role">
        <option value="">Select..</option>
    <!--
        [
          { "id": "super administrator", "name": "Super Administrador"},
          { "id": "administrator", "name": "Administrador"},
          { "id": "editor", "name": "Editor"},
          { "id": "author", "name": "Autor"},
          { "id": "contributor", "name": "Contribuidor"},
          { "id": "subscriber", "name": "Subscriptor" }
        ]
    -->
        @for( role of roleList$ | async; track $index ) {
          <option [value]="role.id">{{ role.name }}</option>
        }

      </select>
    </div>
    <div class="field">
      <label for="user-avatar">Url Avatar</label>
      <!-- <input id="user-avatar" type="file"> -->
      <input formControlName="avatar" id="user-avatar" type="text" placeholder="http://www.dominio.co/images/your-avatar.png">
    </div>
    <div class="field">
      <button
        class="btn-form"
        [disabled]="formData.invalid"
        [class.btn-disabled]="formData.invalid"
      >Edit user</button>
    </div>

  </form>

</div>
