<div class="page page-user-list">

  <h2>User list</h2>

  <pre class="pre">{{ userList$ | async | json }}</pre>

  <div class="description">
    <a href="#" class="btn btn-new">New</a>
  </div>

  <table>

    <tfoot>
      <tr>
        <td colspan="5">
          <small>No olvide que estas acciones solo pueden ser hechas por el ADMIN</small>
        </td>
      </tr>
    </tfoot>
    <tbody>
      @for ( user of ( userList$ | async ); track $index) {
        <tr>
          <td>
            {{ user.name }}
            <fa-icon [icon]="faCoffee" />
          </td>
          <td>
            {{ user.email }}
            <fa-icon [icon]="faLinkedin" />
          </td>
          <td>{{ user.nickname }}</td>
          <td>{{ user.role }}</td>
          <td class="options">
            <a [routerLink]="['/user', 'edit', user._id ]" (click)="onEdit( user._id )" class="btn btn-edit">Edit</a>
            <button (click)="onEdit( user._id )">
              <fa-icon [icon]="faPen" />
              Edit
            </button>
            <button (click)="onDelete( user._id )" class="btn btn-delete">Delete</button>
          </td>
        </tr>
      }
    </tbody>
    <thead>
      <tr>
        <th>User</th>
        <th>Email</th>
        <th>Nickname</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>

  </table>
</div>
